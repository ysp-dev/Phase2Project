<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Rotator — Phase2Project ↔ CreditDev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* 두 사이트를 겹쳐두고 보이기/숨기기만 토글 → 깜빡임·재연결 없음 */
    .frame {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      opacity: 0; pointer-events: none; transition: opacity .4s ease;
    }
    .frame.active { opacity: 1; pointer-events: auto; }

    /* 상단 컨트롤 바 (마우스 올리면 표시) */
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 8px 16px;
      background: rgba(15,15,15,.94); color: #ddd; font: 600 13px/1 system-ui, sans-serif;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #bar input[type=text] {
      background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px;
      padding: 5px 8px; font: 500 13px system-ui; min-width: 240px;
    }
    #bar:hover, body:hover > #bar { opacity: 1; pointer-events: auto; }
    #bar .name { color: #FFBC00; }
    #bar button {
      background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px;
      padding: 5px 12px; font: 600 13px system-ui; cursor: pointer;
    }
    #bar button:hover { background: #383838; }
    #bar .spacer { margin-left: auto; }
    #count { color: #888; }
  </style>
</head>
<body>
  <!-- ▼▼▼ 여기 두 URL과 간격만 바꾸면 됩니다 ▼▼▼ -->
  <script>
    const SITES = [
      { name: 'Phase2Project', url: 'http://localhost:8000/Phase2Project/' },
      { name: 'CreditDev',     url: 'http://localhost:5002/' },
    ];
    let INTERVAL_SEC = 10;     // 전환 간격(초) — 화면에서 조절 가능
  </script>
  <!-- ▲▲▲ -->

  <div id="bar">
    현재: <span class="name" id="now">—</span>
    <span id="count"></span>
    <span class="spacer"></span>
    <label>1번 <input id="url0" type="text" placeholder="http://localhost:8000/Phase2Project/"></label>
    <label>2번 <input id="url1" type="text" placeholder="http://localhost:5002/"></label>
    <label>간격
      <input id="interval" type="number" min="1" step="1" value="10"
             style="width:58px; background:#2a2a2a; color:#ddd; border:1px solid #444; border-radius:6px; padding:5px 6px; font:600 13px system-ui; text-align:right;">
      초
    </label>
    <button id="prev">◀ 이전</button>
    <button id="next">다음 ▶</button>
    <button id="pause">⏸ 일시정지</button>
    <button id="full">⛶ 전체화면</button>
  </div>

  <script>
    // 주소는 위 SITES 배열에 박아둔 값을 항상 사용 (복사·새로고침해도 그대로).
    // 입력란은 현장에서 잠깐 바꿔보는 용도이며 저장하지 않음.

    // URL에서 표시용 이름 도출 (없으면 host:port)
    function labelFor(s) {
      if (s.name) return s.name;
      try { const u = new URL(s.url); return u.host + u.pathname.replace(/\/$/, ''); }
      catch (e) { return s.url; }
    }

    // iframe 생성
    const frames = SITES.map((s, i) => {
      const f = document.createElement('iframe');
      f.className = 'frame' + (i === 0 ? ' active' : '');
      f.src = s.url;
      f.setAttribute('allow', 'fullscreen');
      document.body.appendChild(f);
      return f;
    });

    let cur = 0, paused = false, remain = INTERVAL_SEC;
    const nowEl = document.getElementById('now');
    const countEl = document.getElementById('count');

    function show(idx) {
      cur = (idx + SITES.length) % SITES.length;
      frames.forEach((f, i) => f.classList.toggle('active', i === cur));
      nowEl.textContent = labelFor(SITES[cur]);
      remain = INTERVAL_SEC;
    }
    function tick() {
      if (paused) { countEl.textContent = '(일시정지)'; return; }
      remain--;
      countEl.textContent = '· ' + remain + 's 후 전환';
      if (remain <= 0) show(cur + 1);
    }

    show(0);
    setInterval(tick, 1000);

    // URL 입력 — 현 세션에만 즉시 반영(저장 안 함). 영구 변경은 위 SITES 배열을 수정.
    [0, 1].forEach(i => {
      const inp = document.getElementById('url' + i);
      inp.value = SITES[i].url;
      inp.addEventListener('change', () => {
        const v = inp.value.trim();
        if (!v) { inp.value = SITES[i].url; return; }
        SITES[i].url = v;
        SITES[i].name = null;            // 이름은 URL에서 다시 도출
        frames[i].src = v;               // 해당 iframe 새 주소로 로드
        if (i === cur) nowEl.textContent = labelFor(SITES[i]);
      });
    });

    // 간격 입력 — 즉시 반영
    const intervalEl = document.getElementById('interval');
    intervalEl.value = INTERVAL_SEC;
    intervalEl.addEventListener('change', () => {
      const v = parseInt(intervalEl.value, 10);
      if (v >= 1) { INTERVAL_SEC = v; remain = v; }
      else intervalEl.value = INTERVAL_SEC;
    });

    document.getElementById('next').onclick  = () => show(cur + 1);
    document.getElementById('prev').onclick  = () => show(cur - 1);
    document.getElementById('pause').onclick = e => {
      paused = !paused;
      e.target.textContent = paused ? '▶ 재생' : '⏸ 일시정지';
    };
    document.getElementById('full').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    // 키보드: ←/→ 전환, Space 일시정지, F 전체화면
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(cur + 1);
      else if (e.key === 'ArrowLeft') show(cur - 1);
      else if (e.code === 'Space') { e.preventDefault(); document.getElementById('pause').click(); }
      else if (e.key.toLowerCase() === 'f') document.getElementById('full').click();
    });
  </script>
</body>
</html>
