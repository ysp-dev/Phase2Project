<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Rotator — Phase2Project ↔ CreditDev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* 두 사이트를 겹쳐두고 보이기/숨기기만 토글 → 깜빡임·재연결 없음 */
    .frame {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      opacity: 0; pointer-events: none; transition: opacity .4s ease;
    }
    .frame.active { opacity: 1; pointer-events: auto; }

    /* 상단 컨트롤 바 (마우스 올리면 표시) */
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 8px 16px;
      background: rgba(15,15,15,.94); color: #ddd; font: 600 13px/1 system-ui, sans-serif;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #bar input[type=text] {
      background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px;
      padding: 5px 8px; font: 500 13px system-ui; min-width: 240px;
    }
    #bar.visible { opacity: 1; pointer-events: auto; }
    #bar .name { color: #FFBC00; }
    #bar button {
      background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px;
      padding: 5px 12px; font: 600 13px system-ui; cursor: pointer;
    }
    #bar button:hover { background: #383838; }
    #bar .spacer { margin-left: auto; }
    #count { color: #888; }
    /* iframe 위에 항상 떠있는 상단 트리거 띠 */
    #trigger {
      position: fixed; top: 0; left: 0; right: 0; height: 10px; z-index: 11;
    }
  </style>
</head>
<body>
  <!-- ▼▼▼ 여기 두 URL과 간격만 바꾸면 됩니다 ▼▼▼ -->
  <script>
    const SITES = [
      { name: 'Phase2Project', url: 'http://localhost:8000/Phase2Project/' },
      { name: 'CreditDev',     url: 'http://localhost:5002/' },
    ];
    let INTERVAL_SEC = 10;     // 전환 간격(초) — 화면에서 조절 가능
  </script>
  <!-- ▲▲▲ -->

  <div id="trigger"></div>
  <div id="bar">
    현재: <span class="name" id="now">—</span>
    <span id="count"></span>
    <span class="spacer"></span>
    <label>1번 <input id="url0" type="text" placeholder="http://localhost:8000/Phase2Project/"></label>
    <label>2번 <input id="url1" type="text" placeholder="http://localhost:5002/"></label>
    <label>간격
      <input id="interval" type="number" min="1" step="1" value="10"
             style="width:58px; background:#2a2a2a; color:#ddd; border:1px solid #444; border-radius:6px; padding:5px 6px; font:600 13px system-ui; text-align:right;">
      초
    </label>
    <button id="prev">◀ 이전</button>
    <button id="next">다음 ▶</button>
    <button id="pause">⏸ 일시정지</button>
    <button id="full">⛶ 전체화면</button>
  </div>

  <script>
    // URL에서 표시용 이름 도출 (없으면 host:port)
    function labelFor(s) {
      if (s.name) return s.name;
      try { const u = new URL(s.url); return u.host + u.pathname.replace(/\/$/, ''); }
      catch (e) { return s.url; }
    }

    // localStorage 저장값 복원 (iframe 생성 전에 SITES 배열에 반영)
    [0, 1].forEach(i => {
      const saved = localStorage.getItem('rotator_url' + i);
      if (saved) { SITES[i].url = saved; SITES[i].name = null; }
    });
    const savedInterval = parseInt(localStorage.getItem('rotator_interval'), 10);
    if (savedInterval >= 1) { INTERVAL_SEC = savedInterval; }

    // iframe 생성
    const frames = SITES.map((s, i) => {
      const f = document.createElement('iframe');
      f.className = 'frame' + (i === 0 ? ' active' : '');
      f.src = s.url;
      f.setAttribute('allow', 'fullscreen');
      document.body.appendChild(f);
      return f;
    });

    let cur = 0, paused = false, remain = INTERVAL_SEC;
    let scheduledPauseUntil = 0;  // epoch ms; 0 = 예약중지 없음
    let _lastTriggerKey = '';     // 같은 시간대 중복 발동 방지
    const nowEl = document.getElementById('now');
    const countEl = document.getElementById('count');

    function show(idx) {
      cur = (idx + SITES.length) % SITES.length;
      frames.forEach((f, i) => f.classList.toggle('active', i === cur));
      nowEl.textContent = labelFor(SITES[cur]);
      remain = INTERVAL_SEC;
    }

    // 매일 09:00, 15:00 — 사이트2 고정 후 5분간 로테이션 중지
    const SCHEDULE_HOURS = [9, 15];
    const SCHEDULE_PAUSE_SEC = 5 * 60;
    function checkSchedule() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes();
      if (!SCHEDULE_HOURS.includes(h) || m !== 0) return;
      const key = now.toDateString() + '-' + h;  // 하루+시간 단위 중복 방지
      if (key === _lastTriggerKey) return;
      _lastTriggerKey = key;
      show(1);  // 사이트2(index 1)로 전환
      scheduledPauseUntil = Date.now() + SCHEDULE_PAUSE_SEC * 1000;
    }

    function tick() {
      checkSchedule();
      const inSchedule = Date.now() < scheduledPauseUntil;
      if (inSchedule) {
        const secs = Math.ceil((scheduledPauseUntil - Date.now()) / 1000);
        countEl.textContent = '⏰ 예약중지 · ' + secs + 's 후 재생';
        return;
      }
      if (paused) { countEl.textContent = '(일시정지)'; return; }
      remain--;
      countEl.textContent = '· ' + remain + 's 후 전환';
      if (remain <= 0) show(cur + 1);
    }

    show(0);
    setInterval(tick, 1000);

    // URL 입력 — 즉시 반영 + localStorage 저장
    [0, 1].forEach(i => {
      const inp = document.getElementById('url' + i);
      inp.value = SITES[i].url;
      inp.addEventListener('change', () => {
        const v = inp.value.trim();
        if (!v) { inp.value = SITES[i].url; return; }
        SITES[i].url = v;
        SITES[i].name = null;
        frames[i].src = v;
        localStorage.setItem('rotator_url' + i, v);
        if (i === cur) nowEl.textContent = labelFor(SITES[i]);
      });
    });

    // 간격 입력 — 즉시 반영 + localStorage 저장
    const intervalEl = document.getElementById('interval');
    intervalEl.value = INTERVAL_SEC;
    intervalEl.addEventListener('change', () => {
      const v = parseInt(intervalEl.value, 10);
      if (v >= 1) { INTERVAL_SEC = v; remain = v; localStorage.setItem('rotator_interval', v); }
      else intervalEl.value = INTERVAL_SEC;
    });

    document.getElementById('next').onclick  = () => show(cur + 1);
    document.getElementById('prev').onclick  = () => show(cur - 1);
    document.getElementById('pause').onclick = e => {
      paused = !paused;
      e.target.textContent = paused ? '▶ 재생' : '⏸ 일시정지';
    };
    document.getElementById('full').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    // 트리거 띠에 진입 시 bar 표시, bar에서 벗어나면 300ms 후 숨김
    const bar = document.getElementById('bar');
    const trigger = document.getElementById('trigger');
    let hideTimer;
    function showBar() { clearTimeout(hideTimer); bar.classList.add('visible'); }
    function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(() => bar.classList.remove('visible'), 300); }
    trigger.addEventListener('mouseenter', showBar);
    bar.addEventListener('mouseenter', showBar);
    bar.addEventListener('mouseleave', scheduleHide);

    // 키보드: ←/→ 전환, Space 일시정지, F 전체화면
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(cur + 1);
      else if (e.key === 'ArrowLeft') show(cur - 1);
      else if (e.code === 'Space') { e.preventDefault(); document.getElementById('pause').click(); }
      else if (e.key.toLowerCase() === 'f') document.getElementById('full').click();
    });
  </script>
</body>
</html>
